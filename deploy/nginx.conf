# ==============================================================================
# Nginx Reverse Proxy Configuration for OGE Physics MAX Mini App
# Скопируйте этот файл в /etc/nginx/sites-available/oge-physics и сделайте symlink в sites-enabled
# ==============================================================================

# Gzip сжатие для ускорения загрузки Mini App
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
gzip_min_length 1000;
gzip_comp_level 6;

# 1. HTTP Redirect to HTTPS (Обязательно для WebApp в МАКС)
server {
    listen 80;
    server_name your-domain.ru www.your-domain.ru;

    # Для проверки Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Сервер
server {
    listen 443 ssl http2;
    server_name your-domain.ru;

    # Пути к сертификатам SSL (Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/your-domain.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    # Проксирование всех запросов в FastAPI (который также раздает фронтенд SPA)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / Long-Polling
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Кэширование статических ассетов сборки фронтенда (JS/CSS/картинки с хэшами)
    location /assets/ {
        proxy_pass http://127.0.0.1:8000/assets/;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Кэширование загруженных файлов/фото задач
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000/uploads/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }
}
